services:
  postgres:
    image: postgres:15
    container_name: voicefinance-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: voicefinance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: voicefinance-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: